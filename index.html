<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnHinged — Laser Cut Living Hinge SVG Generator</title>
    <meta name="description" content="Generate downloadable SVG files for laser-cut living hinges. Supports straight, wave, honeycomb, lattice, and beach ball gore patterns.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top machine-style status bar -->
    <header class="status-bar">
        <div class="status-left">
            <div class="logo-mark">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
            </div>
            <h1>UN<span>HINGED</span></h1>
        </div>
        <div class="status-right">
            <div class="status-chip" id="statusChip">
                <span class="status-dot"></span>
                READY
            </div>
            <div class="status-chip dim" id="previewSize">—</div>
        </div>
    </header>

    <main class="workspace">
        <!-- LEFT: Control Panel -->
        <aside class="panel controls-panel">
            <!-- Material & Recommendation -->
            <section class="panel-section">
                <div class="section-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                    <h2>Material</h2>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label for="material">Material Type</label>
                        <select id="material">
                            <option value="mdf">MDF</option>
                            <option value="plywood">Plywood</option>
                            <option value="hardwood">Hardwood</option>
                            <option value="bamboo">Bamboo</option>
                            <option value="acrylic">Acrylic</option>
                            <option value="pvc">PVC / Foam Board</option>
                            <option value="fiber">Fiber Board</option>
                            <option value="cardboard">Cardboard / Paperboard</option>
                        </select>
                    </div>
                    <div class="field field-narrow">
                        <label for="thickness">Thickness</label>
                        <div class="input-unit">
                            <input type="number" id="thickness" value="3" min="0.5" step="0.5">
                            <span>mm</span>
                        </div>
                    </div>
                </div>
                <button id="recommendBtn" class="btn btn-recommend">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                    Recommend Settings
                </button>
                <div id="recommendationBox" class="recommendation-box" style="display:none;"></div>
            </section>

            <!-- Dimensions -->
            <section class="panel-section">
                <div class="section-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 3H3v18h18V3z"/><path d="M9 3v18M3 9h18"/></svg>
                    <h2>Workpiece</h2>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label for="width">Width</label>
                        <div class="input-unit">
                            <input type="number" id="width" value="100" min="10" step="1">
                            <span>mm</span>
                        </div>
                    </div>
                    <div class="field">
                        <label for="height">Height</label>
                        <div class="input-unit">
                            <input type="number" id="height" value="100" min="10" step="1">
                            <span>mm</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Pattern -->
            <section class="panel-section">
                <div class="section-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    <h2>Pattern</h2>
                </div>
                <div class="field">
                    <label for="patternType">Pattern Type</label>
                    <select id="patternType">
                        <option value="straight">Straight Parallel</option>
                        <option value="wave">Wave</option>
                        <option value="honeycomb">Honeycomb</option>
                        <option value="lattice">Lattice (Cross)</option>
                        <option value="beachball">Beach Ball (Gores)</option>
                    </select>
                </div>

                <!-- Honeycomb-specific -->
                <div id="honeycombParams" class="conditional-params" style="display:none;">
                    <div class="field">
                        <label for="cellSize">Cell Size</label>
                        <div class="input-unit">
                            <input type="number" id="cellSize" value="5" min="1" step="0.5">
                            <span>mm</span>
                        </div>
                    </div>
                </div>

                <!-- Beach Ball-specific -->
                <div id="beachBallParams" class="conditional-params" style="display:none;">
                    <div class="field-row">
                        <div class="field">
                            <label for="sphereDiameter">Sphere ⌀</label>
                            <div class="input-unit">
                                <input type="number" id="sphereDiameter" value="100" min="10" step="1">
                                <span>mm</span>
                            </div>
                        </div>
                        <div class="field field-narrow">
                            <label for="numGores">Gores</label>
                            <div class="input-unit">
                                <input type="number" id="numGores" value="6" min="3" step="1">
                                <span>#</span>
                            </div>
                        </div>
                    </div>
                    <div class="field">
                        <label for="sphereShape">Shape</label>
                        <select id="sphereShape">
                            <option value="hemisphere">Hemisphere</option>
                            <option value="full">Full Sphere</option>
                        </select>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="cutLength">Cut Length</label>
                        <div class="input-unit">
                            <input type="number" id="cutLength" value="15" min="1" step="0.5">
                            <span>mm</span>
                        </div>
                    </div>
                    <div class="field">
                        <label for="cutGap">Gap Between Cuts</label>
                        <div class="input-unit">
                            <input type="number" id="cutGap" value="3" min="0.1" step="0.1">
                            <span>mm</span>
                        </div>
                    </div>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label for="webThickness">Web / Column Spacing</label>
                        <div class="input-unit">
                            <input type="number" id="webThickness" value="3" min="0.1" step="0.1">
                            <span>mm</span>
                        </div>
                    </div>
                    <div class="field">
                        <label for="staggerOffset">Stagger / Offset</label>
                        <div class="input-unit">
                            <input type="number" id="staggerOffset" value="50" min="0" max="100" step="5">
                            <span>%</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Output -->
            <section class="panel-section">
                <div class="section-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <h2>Output</h2>
                </div>
                <div class="field">
                    <label for="lineWidth">Stroke Width</label>
                    <select id="lineWidth">
                        <option value="hairline">Hairline (0.001mm)</option>
                        <option value="0.1">0.1 mm</option>
                        <option value="0.25">0.25 mm</option>
                        <option value="0.5">0.5 mm</option>
                        <option value="1" selected>1 mm (preview)</option>
                        <option value="2">2 mm</option>
                    </select>
                </div>
                <button id="downloadBtn" class="btn btn-download">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download SVG
                </button>
            </section>
        </aside>

        <!-- RIGHT: Preview Viewport -->
        <section class="panel preview-panel">
            <div class="preview-toolbar">
                <span class="preview-label">LIVE PREVIEW</span>
                <span class="preview-hint" id="previewHint">Adjust parameters to update</span>
            </div>
            <div class="preview-viewport" id="previewContainer">
                <!-- SVG injected here -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
